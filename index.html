t}}if(scheduleRule&&editing){const anchor=tasks.find(t=>t.id===editing);if(anchor){const archivedDates=new Set(tasks.filter(t=>t.movedTo&&rowKey(t)===rowKey(anchor)).map(t=>t.date));dates=dates.filter(d=>!archivedDates.has(d))}}if(!dates.length){$('#formError').textContent='Выберите хотя бы один день.';return}const previous=tasks.filter(t=>editingIds.has(t.id)),rowId=previous[0]?.rowId||uid(),v={title,time:$('#time').value,category:$('#category').value,notes:$('#notes').value.trim(),rowId,scheduleRule};const position=editing?tasks.findIndex(t=>editingIds.has(t.id)):tasks.length;tasks=tasks.filter(t=>!editingIds.has(t.id));const updated=dates.map(date=>{const old=previous.find(t=>t.date===date);return {...old,...v,id:old?.id||uid(),date,done:old?.done||false}});tasks.splice(position<0?tasks.length:position,0,...updated);week=monday(fromKey(dates[0]));save();$('#editor').close();toast('Дело сохранено')};$('#delete').onclick=()=>{tasks=tasks.filter(t=>!editingIds.has(t.id));save();$('#editor').close();toast('Дело удалено')};$('#prev').onclick=()=>{week=shift(week,-7);if(filter==='today')filter='all';render()};$('#next').onclick=()=>{week=shift(week,7);if(filter==='today')filter='all';render()};$('#today').onclick=()=>{week=monday(fromKey(todayKey));filter='today';$('#search').value='';render();$('#board').scrollIntoView({block:'nearest',behavior:'smooth'})};$('#search').oninput=render;document.querySelector('aside').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;if(filter==='today')week=monday(fromKey(todayKey));render()}});$('#mobileFilter').onchange=e=>{filter=e.target.value;if(filter==='today')week=monday(fromKey(todayKey));render()};$('#export').onclick=()=>{const list=tasks.filter(t=>t.date>=key(week)&&t.date<=key(shift(week,6))).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));const text='ПЛАН НА НЕДЕЛЮ\n'+$('#weekTitle').textContent+'\n\n'+Array.from({length:7},(_,i)=>{const d=shift(week,i);return names[i]+' '+d.toLocaleDateString('ru-RU')+'\n'+list.filter(t=>t.date===key(d)).map(t=>`${t.movedTo?'[Перенесено → '+dateLabel(t.movedTo)+']':t.done?'[✓]':'[ ]'} ${t.time?t.time+' ':''}${t.title} (${cats[t.category]?.label||'Без категории'})${t.originalDate?' · Изначально: '+dateLabel(t.originalDate):''}${t.notes?'\n    '+t.notes:''}`).join('\n')}).join('\n\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='plan-'+key(week)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('План подготовлен к скачиванию')};window.addEventListener('storage',e=>{if(e.key===categoryStorageKey){try{const data=JSON.parse(e.newValue);if(data&&typeof data==='object'&&!Array.isArray(data)){replaceCategories(data);if(!['all','today'].includes(filter)&&!cats[filter])filter='all';render()}}catch{}return}if(e.key===storageKey){try{const data=JSON.parse(e.newValue||'[]');if(Array.isArray(data)){tasks=data;render()}}catch{}}});render();
// Russian dictation is split locally into editable tasks before saving.
const SpeechInput=window.SpeechRecognition||window.webkitSpeechRecognition;
let voiceRecognition=null,voiceListening=false,voiceError=false,voiceBase='',voiceDraft=[];
const voiceAction='(?:купить|помыть|продать|забрать|отвезти|привезти|позвонить|написать|сделать|оплатить|проверить|заехать|сходить|пойти|убрать|починить|заменить|установить|заказать|отправить|помочь|покормить|обслужить|полить|записаться|выучить|прочитать|заняться|позаниматься|приготовить|встретить|встретиться|вынести|заправить|зарядить|постирать|погладить|погулять|заполнить|получить|заплатить|сдать|забрать)';
function parseVoiceTasks(text,baseDate=moscowDate()){
 let date=baseDate;
 const weekdayWords={понедельник:0,вторник:1,среду:2,среда:2,четверг:3,пятницу:4,пятница:4,субботу:5,суббота:5,воскресенье:6};
 const datePattern=/(?<![а-яё])(?:(?:на\s+)?(?:послезавтра|завтра|сегодня)|(?:в|во|на)\s+(?:понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье))(?![а-яё])/giu;
 const clean=text.replace(/(?:новая задача|новое дело|следующая задача|следующее дело|точка с запятой|запятая)/giu,';').replace(/\s+(?:и|а также|потом|затем)\s+(?=(?:сегодня|завтра|послезавтра|(?:в|во|на)\s+(?:понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье))|(?:купить|помыть|продать|забрать|позвонить|сделать))/giu,';');
 // A new date sets the date for all following actions until another date is spoken.
 const marked=clean.replace(datePattern,m=>'\n@'+m+'@\n');
 const result=[];
 for(const part of marked.split(/(@[^@]+@)/u)){
  if(part.startsWith('@')&&part.endsWith('@')){
   const token=part.slice(1,-1).toLowerCase();
   if(token.includes('послезавтра'))date=key(shift(fromKey(baseDate),2));
   else if(token.includes('завтра'))date=key(shift(fromKey(baseDate),1));
   else if(token.includes('сегодня'))date=baseDate;
   else{const word=token.split(/\s+/).pop(),weekday=weekdayWords[word],offset=(weekday-(fromKey(baseDate).getDay()+6)%7+7)%7;date=key(shift(fromKey(baseDate),offset));}
   continue;
  }
  const splitActions=part.replace(new RegExp('\\s+(?:и\\s+|затем\\s+|потом\\s+|а также\\s+)?(?='+voiceAction+'(?=\\s|$))','giu'),';');
  for(let title of splitActions.split(/[,;!?\n]+|\.(?!\d)/u)){
   title=title.replace(/^\s*(?:(?:и|а|потом|затем|а также)\s+|(?:мне\s+)?(?:нужно|надо)\s+|(?:добавь|добавить|запиши|записать|запланируй)\s+(?:(?:дела|дело|задачи|задачу)\s*)?[:—-]?\s*)+/iu,'').replace(/\s+(?:и|а|потом|затем)$/iu,'').replace(/^[\s:—-]+|[\s:—-]+$/gu,'');
   if(title)result.push({title:title[0].toLocaleUpperCase('ru-RU')+title.slice(1),date});
  }
 }
 return result;
}
function stopVoice(abort=false){if(voiceRecognition){try{abort?voiceRecognition.abort():voiceRecognition.stop()}catch{}}}
function voiceBusy(active){voiceListening=active;$('#voiceRecord').textContent=active?'■ Остановить':'🎙 Говорить';$('#voiceRecord').setAttribute('aria-pressed',String(active));$('#voiceText').readOnly=active;$('#voiceParse').disabled=active;$('#voiceSave').disabled=active||!voiceDraft.length;}
function renderVoiceDraft(){
 $('#voicePreview').innerHTML=voiceDraft.map((t,i)=>`<div class="voice-item"><input data-voice-title="${i}" value="${esc(t.title)}" maxlength="160" aria-label="Название дела ${i+1}"><div class="voice-item-bottom"><input type="date" data-voice-date="${i}" value="${esc(t.date)}" aria-label="Дата дела ${i+1}"><button type="button" class="delete" data-voice-remove="${i}" aria-label="Убрать дело ${i+1}">Убрать</button></div></div>`).join('');
 $('#voiceCount').textContent=voiceDraft.length?'Отдельных дел: '+voiceDraft.length:'';$('#voiceSave').textContent='Сохранить дела'+(voiceDraft.length?' ('+voiceDraft.length+')':'');$('#voiceSave').disabled=voiceListening||!voiceDraft.length;
}
function parseVoicePreview(){voiceDraft=parseVoiceTasks($('#voiceText').value);renderVoiceDraft();if(!voiceDraft.length)$('#voiceStatus').textContent='Продиктуйте или напишите хотя бы одно дело.';}
function startVoice(){
 if(voiceListening){stopVoice();return}
 if(!SpeechInput){$('#voiceStatus').textContent='В этом браузере голосовой ввод недоступен. Можно надиктовать текст микрофоном клавиатуры, затем нажать «Разобрать текст».';$('#voiceText').focus();return}
 if(location.protocol!=='https:'&&!['localhost','127.0.0.1','[::1]'].includes(location.hostname)){$('#voiceStatus').textContent='Для микрофона откройте сайт по защищённому адресу HTTPS. Здесь можно использовать микрофон клавиатуры или ввести текст вручную.';return}
 voiceBase=$('#voiceText').value.trim();voiceError=false;
 const recognition=new SpeechInput();voiceRecognition=recognition;recognition.lang='ru-RU';recognition.continuous=true;recognition.interimResults=true;
 recognition.onstart=()=>{if(voiceRecognition!==recognition)return;voiceBusy(true);$('#voiceStatus').textContent='Слушаю… Назовите дату и перечислите дела.'};
 recognition.onresult=e=>{if(voiceRecognition!==recognition)return;let heard='';for(let i=0;i<e.results.length;i++)heard+=(heard?' ':'')+e.results[i][0].transcript;$('#voiceText').value=(voiceBase?voiceBase+'; ':'')+heard;};
 recognition.onerror=e=>{if(voiceRecognition!==recognition)return;voiceError=true;const messages={'not-allowed':'Разрешите доступ к микрофону в настройках браузера или используйте микрофон клавиатуры.','service-not-allowed':'Сервис распознавания недоступен в этом браузере. Используйте микрофон клавиатуры.','audio-capture':'Микрофон не найден или занят другим приложением.','network':'Нет связи с сервисом распознавания. Проверьте интернет или используйте микрофон клавиатуры.','no-speech':'Речь не распознана. Нажмите «Говорить» и попробуйте ещё раз.','language-not-supported':'Распознавание русского языка недоступно. Используйте микрофон клавиатуры.'};$('#voiceStatus').textContent=messages[e.error]||'Не удалось распознать речь. Попробуйте ещё раз или введите текст.';};
 recognition.onend=()=>{if(voiceRecognition!==recognition)return;voiceRecognition=null;voiceBusy(false);if($('#voiceEditor').open){parseVoicePreview();if(!voiceError&&voiceDraft.length)$('#voiceStatus').textContent='Проверьте названия и даты, затем сохраните дела.'}};
 voiceBusy(true);$('#voiceStatus').textContent='Подключаю микрофон…';try{recognition.start()}catch{voiceRecognition=null;voiceBusy(false);$('#voiceStatus').textContent='Не удалось включить микрофон. Попробуйте ещё раз или используйте микрофон клавиатуры.'}
}
$('#voiceTask').onclick=()=>{if(!$('#voiceText').value)voiceDraft=[];$('#voiceCategory').innerHTML='<option value="">Без категории</option>'+Object.entries(cats).map(([id,c])=>`<option value="${esc(id)}">${esc(c.label)}</option>`).join('');$('#voiceCategory').value=cats[filter]?filter:(cats.personal?'personal':'');$('#voiceStatus').textContent='Например: «Завтра купить хлеб, помыть машину, продать ведро». Без даты дела записываются на сегодня.';renderVoiceDraft();$('#voiceEditor').showModal();startVoice()};
$('#voiceRecord').onclick=startVoice;
$('#closeVoice').onclick=()=>$('#voiceEditor').close();
$('#voiceEditor').addEventListener('close',()=>{stopVoice(true);voiceRecognition=null;voiceBusy(false)});
$('#voiceEditor').addEventListener('cancel',()=>{stopVoice(true)});
$('#voiceParse').onclick=parseVoicePreview;
$('#voiceText').oninput=()=>{voiceDraft=[];renderVoiceDraft();$('#voiceStatus').textContent='Нажмите «Разобрать текст», чтобы обновить список дел.'};
$('#voicePreview').addEventListener('input',e=>{if(e.target.dataset.voiceTitle!==undefined)voiceDraft[Number(e.target.dataset.voiceTitle)].title=e.target.value;if(e.target.dataset.voiceDate!==undefined)voiceDraft[Number(e.target.dataset.voiceDate)].date=e.target.value});

function saveVoiceDraft(){
 if(voiceListening||!voiceDraft.length)return;
 if(voiceDraft.some(t=>!t.title.trim()||t.title.trim().length>160||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||Number.isNaN(fromKey(t.date).getTime()))){$('#voiceStatus').textContent='Проверьте названия (до 160 символов) и даты всех дел.';return}
 const category=$('#voiceCategory').value,added=voiceDraft.map(t=>({id:uid(),rowId:uid(),title:t.title.trim(),date:t.date,time:'',category:cats[category]?category:'',notes:'',done:false})),next=[...tasks,...added];
 try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{$('#voiceStatus').textContent='Не удалось сохранить дела. Список оставлен открытым — попробуйте ещё раз.';return}
 tasks=next;storageOK=true;week=monday(fromKey(added.map(t=>t.date).sort()[0]));filter='all';$('#search').value='';voiceDraft=[];$('#voiceText').value='';$('#voiceEditor').close();render();toast('Сохранено отдельных дел: '+added.length);
}
$('#voiceSave').onclick=saveVoiceDraft;
